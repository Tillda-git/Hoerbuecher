name: Katalog aktualisieren

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hörbücher suchen und App-Daten schreiben
        run: python hoerbuch_finder.py site

      - name: Ergebnis speichern
        run: |
          git config user.name  "katalog-bot"
          git config user.email "katalog-bot@users.noreply.github.com"
          git add docs hoerbuecher.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Katalog aktualisiert $(date +%F)"
            git push
          fi
